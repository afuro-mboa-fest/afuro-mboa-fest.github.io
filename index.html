<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: one narrow tournament column. Poster hero with a vertical kanji title, a sticky tab rail, then one board per view.
   A separate landscape "big screen" view for projecting the live ranking. Single dark look, by choice: the festival's red / gold / black charter. */
:root{
  color-scheme:dark;
  --night:#120d0b;      /* page ground, warm black */
  --board:#1c1512;      /* raised boards */
  --ember:#2a1611;      /* warm tint for featured boards */
  --well:#281e1a;       /* inputs, pressed states */
  --rule:#3e2f29;       /* hairlines */
  --paper:#f7efe4;      /* main text */
  --dust:#b9a698;       /* secondary text */
  --red:#d9281d;        /* brand red: actions, live, duels */
  --red-ink:#ff6b5d;    /* red used as text on dark */
  --red-soft:rgba(217,40,29,.2);
  --gold:#f2b53f;       /* brand gold: prizes, winners, clocks */
  --gold-line:#7a5a22;  /* gold hairline */
  --gold-soft:rgba(242,181,63,.11);
  --go:#57c98a;         /* confirmed, qualified, bonus */
  --go-soft:rgba(87,201,138,.14);
  --wa:#25d366;         /* WhatsApp button */
  --qr-bg:#ffffff;      /* QR codes stay black on white in every theme */
  --qr-ink:#000000;
  --on-red:#fff7f0;
  --on-gold:#1d1206;
  --on-wa:#062b14;
  --shadow:rgba(0,0,0,.5);
  --f-display:"Dela Gothic One","Arial Black","Helvetica Neue",Impact,sans-serif;
  --f-body:"Archivo","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p,ul,ol,dl,dd,figure,blockquote{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-stretch:82%;color:var(--dust)}
.muted{color:var(--dust)}
.fine{font-size:13px;color:var(--dust);line-height:1.45}
.num{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;-webkit-user-select:all;user-select:all}
.stack{display:flex;flex-direction:column;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* preview banner (staff only) */
.preview{background:var(--gold);color:var(--on-gold)}
.preview .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;font-weight:700;font-size:14px;flex-wrap:wrap}

/* top bar */
.top-in{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;padding-block:14px 4px}
.brand{display:flex;gap:8px;align-items:baseline;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-stretch:82%;color:var(--dust)}
.brand b{color:var(--paper);font-weight:800}
.phase{display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 9px;border-radius:999px;border:1px solid var(--gold-line);background:var(--board);color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-stretch:85%}
.phase .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.phase.is-live{background:var(--red);border-color:var(--red);color:var(--on-red)}
.phase.is-live .dot{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.updated{width:100%;font-size:12px;color:var(--dust)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--rule);background:
  radial-gradient(90% 70% at 100% 0%,rgba(217,40,29,.32),transparent 70%),
  repeating-linear-gradient(-62deg,rgba(242,181,63,.05) 0 1px,transparent 1px 18px),
  var(--night)}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;padding-block:16px 0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-stretch:82%;color:var(--red-ink)}
.title{margin-top:10px;font-family:var(--f-display);font-weight:400;font-synthesis:none;line-height:1.04;text-transform:uppercase}
.title .t1{display:block;font-size:clamp(20px,6vw,34px);color:var(--paper)}
.title .t2{display:block;font-size:clamp(30px,9vw,60px);color:var(--gold)}
.tagline{margin-top:12px;max-width:34ch;font-size:15px}
.slogan{margin-top:10px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-stretch:80%;color:var(--dust)}
.slogan i{font-style:normal;color:var(--red-ink);padding-inline:5px}
.kanji{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:2px}
.kanji span{writing-mode:vertical-rl;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,12vw,76px);line-height:1;letter-spacing:.06em;color:var(--gold)}
.seal{display:grid;place-items:center;width:34px;height:34px;border-radius:5px;background:var(--red);color:var(--on-red);font-family:var(--f-display);font-weight:400;font-size:19px;transform:rotate(-6deg)}
.hero-mini{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 0}
.mini-title{font-family:var(--f-display);font-weight:400;font-synthesis:none;font-size:clamp(17px,5vw,26px);line-height:1.1;text-transform:uppercase}
.mini-title b{font-weight:400;color:var(--gold)}
.mini-kanji{flex:none;font-family:var(--f-display);font-size:clamp(20px,6vw,30px);color:var(--gold)}
.hero.compact .clock{margin-block:10px 14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin-top:18px;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--rule)}
.facts div{min-width:0;padding:10px 12px;background:var(--board)}
.facts dt{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-stretch:82%;color:var(--dust)}
.facts dd{margin-top:2px;font-size:15px;font-weight:700;line-height:1.3}
.facts dd.gold{color:var(--gold)}
@media (min-width:600px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.clock{margin-top:12px;padding:12px;border-radius:var(--radius);border:1px solid var(--rule);background:var(--board)}
.clock-digits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.clock-digits.no-days{grid-template-columns:repeat(3,minmax(0,1fr))}
.cu{display:flex;flex-direction:column;align-items:center;padding:8px 2px 6px;border-radius:8px;background:var(--well)}
.cu b{font-size:clamp(28px,8.5vw,44px);font-weight:800;font-stretch:78%;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold)}
.cu i{margin-top:4px;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dust)}
.clock-now{margin-top:6px;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold)}
.cta{display:flex;flex-wrap:wrap;gap:10px;padding-block:14px 20px}
.cta .btn{flex:1 1 auto;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:1px solid transparent;border-radius:10px;background:var(--well);color:var(--paper);font-size:15px;font-weight:800;letter-spacing:.01em;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer}
.btn-red{background:var(--red);color:var(--on-red)}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-wa{background:var(--wa);color:var(--on-wa)}
.btn-line{background:transparent;border-color:var(--rule);color:var(--paper)}
.btn-dark{background:transparent;border-color:var(--on-gold);color:var(--on-gold)}
.btn-danger{background:transparent;border-color:var(--red-ink);color:var(--red-ink)}
.btn.armed{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn-sm{min-height:38px;padding:0 12px;border-radius:8px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{align-self:center;padding:8px;border:0;background:none;color:var(--dust);font-size:13px;text-decoration:underline;cursor:pointer}
.link{font-size:13px;font-weight:800;color:var(--gold)}

/* flash band */
.flash{background:var(--red);color:var(--on-red)}
.flash .wrap{display:flex;align-items:baseline;gap:12px;padding-block:10px}
.flash b{flex:none;font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.flash p{min-width:0;font-weight:700;overflow-wrap:anywhere}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--night);border-bottom:1px solid var(--rule)}
.tabs-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:flex;align-items:center;justify-content:center;gap:5px;min-height:50px;margin-bottom:-1px;padding:0 2px;border:0;border-bottom:3px solid transparent;background:none;color:var(--dust);font-size:clamp(12px,3.3vw,14px);font-weight:800;letter-spacing:.02em;text-transform:uppercase;font-stretch:76%;line-height:1.1;text-align:center;text-decoration:none;cursor:pointer}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--gold)}
.live-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--red-ink);animation:pulse 1.4s ease-in-out infinite}

/* views */
.main{padding-block:22px 36px}
.view{display:flex;flex-direction:column;gap:20px}
.view [id]{scroll-margin-top:calc(64px + env(safe-area-inset-top,0px))}
#v-tabs{scroll-margin-top:env(safe-area-inset-top,0px)}
.view-head h2{font-family:var(--f-display);font-weight:400;font-synthesis:none;font-size:24px;line-height:1.15;text-transform:uppercase}
.view-head p{margin-top:6px;max-width:60ch;color:var(--dust)}
.row-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card{padding:16px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--board)}
.empty{padding:18px 16px;border:1px dashed var(--rule);border-radius:var(--radius);color:var(--dust);text-align:center}
.ticks{list-style:none;padding:0;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.ticks li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:baseline}
.ticks li::before{content:"";width:8px;height:8px;transform:rotate(45deg) translateY(-2px);background:var(--gold)}

/* announcements */
.feed{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.news{padding:12px 14px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--board)}
.news:first-child{border-color:var(--gold-line)}
.news-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.news-meta time{font-size:13px;font-weight:800;font-stretch:82%;font-variant-numeric:tabular-nums;color:var(--dust)}
.kind{padding:2px 8px;border-radius:4px;background:var(--well);color:var(--dust);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.k-indice .kind{background:var(--gold);color:var(--on-gold)}
.k-duel .kind{background:var(--red);color:var(--on-red)}
.k-alerte .kind{background:transparent;color:var(--red-ink);box-shadow:inset 0 0 0 1px var(--red-ink)}
.k-resultat .kind{background:var(--go);color:var(--on-gold)}
.news-text{margin-top:6px;white-space:pre-line;overflow-wrap:anywhere}

/* boards */
.board{list-style:none;padding:0;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--board)}
.row{display:grid;grid-template-columns:24px 30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.rank{text-align:right;font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums;color:var(--dust)}
.band{display:block;flex:none;width:30px;height:14px;border-radius:3px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.2)}
.who{min-width:0}
.who b{display:block;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.who small{display:block;font-size:13px;color:var(--dust)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.score{font-size:20px;font-weight:800;font-stretch:80%;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.score small{margin-left:4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dust)}
.chip{padding:2px 8px;border-radius:999px;background:var(--well);color:var(--dust);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.chip.ok,.chip.st-finale{background:var(--go-soft);color:var(--go)}
.chip.wait{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.chip.st-course{background:var(--well);color:var(--paper)}
.chip.st-gagnante{background:var(--gold);color:var(--on-gold)}
.chip.st-eliminee{background:transparent;color:var(--red-ink);box-shadow:inset 0 0 0 1px var(--red-ink)}
.row.s-gagnante{background:var(--gold-soft)}
.row.s-gagnante .rank{color:var(--gold)}
.row.s-eliminee .who,.row.s-eliminee .score,.row.s-eliminee .band{opacity:.5}
.row.s-eliminee .who b{text-decoration:line-through;text-decoration-thickness:2px}
.tchip{font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap}
.tchip.out,.bigclock.out{color:var(--red-ink)}
.podium{padding:16px;border:1px solid var(--gold-line);border-radius:var(--radius);background:linear-gradient(160deg,var(--ember),var(--board) 70%)}
.podium ol{list-style:none;padding:0;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.podium li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center}
.podium li b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.15;color:var(--gold);overflow-wrap:anywhere}
.podium li small{display:block;font-size:13px;color:var(--dust)}
.podium .fine{margin-top:12px}

/* duels */
.duels{display:grid;gap:10px}
.duel{padding:14px;border:1px solid var(--red);border-radius:var(--radius);background:linear-gradient(135deg,var(--red-soft),var(--board) 65%)}
.duel.mine{border-color:var(--gold)}
.duel-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-stretch:82%;color:var(--red-ink)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin-top:10px}
.vs-side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.vs-x{font-family:var(--f-display);font-size:24px;color:var(--gold)}
.duel .fine{margin-top:10px}

/* my team */
.picker{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--board);color:var(--paper);font-size:16px;font-weight:800;text-align:left;cursor:pointer}
.pick small{font-size:13px;font-weight:700;color:var(--dust)}
.me-head{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:12px}
.me-head b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.me-head small{display:block;font-size:13px;color:var(--dust)}
.me-clock{padding:16px;border:1px solid var(--gold-line);border-radius:var(--radius);background:linear-gradient(160deg,var(--ember),var(--board) 70%);text-align:center}
.bigclock{margin-top:4px;font-size:clamp(52px,17vw,104px);font-weight:800;font-stretch:72%;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold)}
.me-clock .fine{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--rule)}
.stats div{padding:10px 8px;background:var(--board);text-align:center}
.stats b{display:block;font-size:24px;font-weight:800;font-stretch:80%;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-stretch:82%;color:var(--dust)}
.note{padding:12px 14px;border:1px solid var(--gold-line);border-radius:10px;background:var(--gold-soft);font-size:15px}
.note.bad{border-color:var(--red-ink);background:var(--red-soft)}
.note.good{border-color:var(--go);background:var(--go-soft)}
.log{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--board);font-size:14px}
.log .plus{color:var(--go);font-weight:800;white-space:nowrap}
.log .minus{color:var(--red-ink);font-weight:800;white-space:nowrap}
.log time{font-size:12px;color:var(--dust);font-variant-numeric:tabular-nums}
.mine-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--board)}
.solved{color:var(--go);font-weight:800;font-size:13px}

/* pass ticket */
.pass{position:relative;padding:18px 18px 16px;border:1px solid var(--gold-line);border-radius:var(--radius);background:linear-gradient(135deg,var(--ember),var(--board) 65%)}
.pass-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.pass-name{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-stretch:82%;color:var(--gold)}
.pass-price{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.pass-price small{font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--dust)}
.pass-split{margin-top:2px;font-size:14px;color:var(--dust)}
.pass-total{position:relative;margin-top:14px;padding-top:12px;border-top:1px dashed var(--gold-line);font-weight:800;font-size:17px}
.pass-total::before,.pass-total::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--night);border:1px solid var(--gold-line)}
.pass-total::before{left:-29px;clip-path:inset(0 0 0 50%)}
.pass-total::after{right:-29px;clip-path:inset(0 50% 0 0)}
.pass-incl{list-style:none;padding:0;margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.pass-incl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:baseline}
.pass-incl li::before{content:"";width:7px;height:7px;transform:rotate(45deg) translateY(-2px);background:var(--gold)}
.pass .fine{margin-top:10px}
.places{display:flex;flex-direction:column;gap:8px}
.places-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--dust)}
.places-top b{font-size:16px;color:var(--paper)}
.bar{height:8px;border-radius:999px;background:var(--well);overflow:hidden}

/* registration form */
.form{display:flex;flex-direction:column;gap:16px}
.fs{min-width:0;margin:0;padding:14px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--board);display:flex;flex-direction:column;gap:14px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.member .field{flex:1 1 170px}
.field label,.lbl{font-size:14px;font-weight:700}
.input{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--well);color:var(--paper);font-size:16px}
textarea.input{min-height:96px;resize:vertical}
.input::placeholder{color:var(--dust);opacity:.75}
.input[aria-invalid="true"],.seg[aria-invalid="true"]{border-color:var(--red-ink);box-shadow:0 0 0 1px var(--red-ink)}
.hint{font-size:13px;color:var(--dust)}
.err{color:var(--red-ink);font-weight:700}
.colors[aria-invalid="true"]{outline:2px solid var(--red-ink);outline-offset:4px;border-radius:12px}
.member{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.seg{display:inline-flex;flex:none;border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--well)}
.seg label{display:flex}
.seg input,.color input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg span{display:flex;align-items:center;min-height:46px;padding:0 13px;font-size:14px;font-weight:700;color:var(--dust);cursor:pointer}
.seg input:checked+span{background:var(--paper);color:var(--night)}
.seg input:focus-visible+span{outline:2px solid var(--gold);outline-offset:-3px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.color span{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 13px 0 9px;border:1px solid var(--rule);border-radius:999px;background:var(--well);font-size:14px;font-weight:700;cursor:pointer}
.color span::before{content:"";width:22px;height:12px;border-radius:3px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.color input:checked+span{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.color input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.girls{font-size:14px;font-weight:700;color:var(--dust)}
.girls.ok{color:var(--go)}
.girls.no{color:var(--red-ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;border-radius:10px;background:var(--well);font-weight:700}
.total b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold)}
.errbox{padding:12px 14px;border:1px solid var(--red-ink);border-radius:10px;color:var(--red-ink);font-weight:700;font-size:14px}
.errbox ul{margin:6px 0 0;padding-left:18px;font-weight:600}
.done{display:flex;flex-direction:column;gap:16px;padding:16px;border:1px solid var(--gold-line);border-radius:var(--radius);background:var(--board)}
.done h3{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.2;text-transform:uppercase;color:var(--gold)}
.todo{list-style:none;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:s}
.todo>li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;counter-increment:s}
.todo>li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--red);color:var(--on-red);font-family:var(--f-display);font-size:16px}
.todo>li>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.msg{width:100%;min-height:220px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--well);color:var(--paper);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}

/* rules */
.steps{list-style:none;padding:0;display:flex;flex-direction:column}
.step{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding-bottom:24px}
.step::before{content:"";position:absolute;left:21px;top:48px;bottom:4px;border-left:2px dashed var(--rule)}
.step:last-child{padding-bottom:0}
.step:last-child::before{display:none}
.step-n{display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--gold);border-radius:50%;color:var(--gold);font-family:var(--f-display);font-size:19px}
.step-when{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-stretch:82%;color:var(--red-ink)}
.step h3{margin-top:2px;font-size:19px;font-weight:800;line-height:1.25}
.step p{margin-top:6px}
.fork,.env{display:grid;gap:8px;margin-top:10px}
.fork{grid-template-columns:repeat(2,minmax(0,1fr))}
.env{grid-template-columns:repeat(3,minmax(0,1fr))}
.fork div{min-width:0;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--board)}
.fork em{display:block;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dust)}
.fork b{display:block;margin-top:2px;font-weight:800;line-height:1.25}
.fork small{display:block;margin-top:4px;font-size:13px;line-height:1.35;color:var(--dust)}
.env span{display:grid;place-items:center;padding:9px 6px;border-radius:8px;background:var(--well);font-size:13px;font-weight:700;line-height:1.25;text-align:center}
.env span:first-child{color:var(--go)}
.env span:nth-child(2){color:var(--red-ink)}
.env span:last-child{color:var(--gold)}
.quote{padding:18px 16px;border-radius:var(--radius);background:var(--red);color:var(--on-red)}
.quote p{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3}
.quote figcaption{margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.prog{list-style:none;padding:0;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--board)}
.prog li{display:grid;grid-template-columns:60px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--rule)}
.prog li:first-child{border-top:0}
.prog time{font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums;color:var(--dust)}
.prog li.hl{background:var(--gold-soft)}
.prog li.hl time,.prog li.hl span{color:var(--gold);font-weight:800}
.contacts{display:grid;gap:8px}
.contact{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px 10px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--board)}
.contact small{display:block;font-size:12px;color:var(--dust)}
.contact .num{font-size:18px}

/* footer */
.foot{border-top:1px solid var(--rule)}
.foot .wrap{display:flex;flex-direction:column;gap:6px;padding-block:22px 96px}
.foot-brand{font-family:var(--f-display);font-weight:400;font-size:16px;text-transform:uppercase}
.foot-brand span{margin-left:8px;color:var(--gold)}
.foot p+p{font-size:13px;color:var(--dust)}

/* sheets: staff panel and riddle */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:1px solid var(--gold);border-radius:999px;background:var(--night);color:var(--gold);font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px var(--shadow)}
.fab i{width:9px;height:9px;border-radius:50%;background:var(--red-ink)}
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);background:var(--night)}
.sheet.riddle{z-index:55}
.sheet-head{flex:none;border-bottom:1px solid var(--rule)}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.sheet-title{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15;text-transform:uppercase}
.riddle .sheet-bar{padding-block:12px}
.sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body>.wrap{display:flex;flex-direction:column;gap:18px;padding-block:16px 28px}
.sheet-foot{flex:none;border-top:1px solid var(--rule);background:var(--board);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-foot .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
.sheet-foot .btn{flex:none}
.sheet-foot .check{margin-right:auto}
.pubstate{flex:1 1 100%;font-size:13px;font-weight:700;color:var(--dust)}
.pubstate.dirty{color:var(--gold)}
.secs{display:flex;overflow-x:auto;scrollbar-width:none}
.secs::-webkit-scrollbar{display:none}
.secs .tab{flex:1 0 auto;padding:0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--board);cursor:pointer}
.opt input{flex:none;width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold)}
.opt b{display:block;font-weight:800}
.opt small{display:block;font-size:13px;color:var(--dust)}
.opt:has(input:checked){border-color:var(--gold-line);background:var(--gold-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trow,.sduel,.rcard{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--board)}
.sduel.on{border-color:var(--red)}
.trow-top{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px}

.trow-clock .tchip{font-size:20px}

.pills,.adj{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

.adj button.minus{color:var(--red-ink);font-weight:800}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--gold)}
.nlist{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}

.notice{padding:12px 14px;border:1px solid var(--gold-line);border-radius:10px;background:var(--gold-soft);display:flex;flex-direction:column;gap:10px;font-size:14px}

  function tickHero(now) {
    var el = $('clock');
    if (!el) return;
    var cd = S().countdown, t = parseT(cd.at);
    if (t == null) { el.hidden = true; clockKey = ''; return; }
    var diff = t - now, mode = diff >= 86400000 ? 'days' : diff > 0 ? 'run' : diff > -HOUR ? 'now' : 'past';
    var label = cd.label || 'Compte à rebours';
    var key = label + '|' + cd.at + '|' + mode;
    if (key !== clockKey) {
      clockKey = key;
      if (mode === 'past') { el.hidden = true; el.innerHTML = ''; return; }
      el.innerHTML = mode === 'now'
        ? '<p class="label">' + esc(label) + '</p><p class="clock-now">C’est maintenant !</p>'
        : '<p class="label">' + esc(label) + ' dans</p><div class="clock-digits' + (mode === 'run' ? ' no-days' : '') + '" role="timer">' + (mode === 'days' ? unitBox('d', 'jours') : '') + unitBox('h', 'heures') + unitBox('m', 'min') + unitBox('s', 'sec') + '</div>';

      case 'screen-exit': try { location.hash = 'direct'; } catch (x) { setScreen(false); } break;
      case 'fullscreen':
        try { var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () { toast('Plein écran indisponible ici : utilise celui du navigateur.'); }); } catch (x) { toast('Plein écran indisponible ici.'); }
        break;
      case 'staff-open': case 'staff-login': if (ui.canEdit) openStaff(); else openLogin(); break;
      case 'login-close': closeLogin(); break;
      case 'logout': arm(a, 'Confirmer la déconnexion', signOut); break;
      case 'staff-close': closeStaff(); break;
      case 'sec': ui.sec = a.getAttribute('data-sec'); renderStaff(true); persistStaff(); break;
      case 'publish': publishNow(); break;
      case 'auto': saveLS(LS.auto, !!a.checked); if (a.checked) scheduleAuto(false); else clearTimeout(timers.auto); updatePubBar(); break;
      case 'discard': arm(a, 'Tout annuler ?', function () { ui.ops = []; ui.unsure = null; ui.sentCount = 0; recompute(); renderPublic(); renderStaff(); persistStaff(); }); break;
      case 'cd-preset': cdPreset(a.getAttribute('data-p')); break;
      case 'hunt-start': arm(a, 'Confirmer le départ', function () {
        var ready = d.teams.filter(function (t) { return t.paid && t.status === 'pret'; }).length;
        addOp({ k: 'hunt-start', mins: d.settings.huntMinutes }, false);
        addOp(news('alerte', 'Top départ ! La chasse est lancée : ' + ready + ' équipes en course, ' + d.settings.huntMinutes + ' minutes au chrono.'));
      }); break;
      case 'hunt-reset': arm(a, 'Confirmer la remise à zéro', function () { addOp({ k: 'hunt-reset' }); }); break;
      case 'qualify': arm(a, 'Confirmer la qualification', function () {
        var q = qualifyPlan(d);
        addOp({ k: 'qualify', ids: q.teams.map(function (t) { return t.id; }) }, false);
        addOp(news('resultat', 'Qualifiées pour la finale : ' + q.teams.map(function (t) { return t.name; }).join(', ') + '.'));
      }); break;
      case 'finale-start': arm(a, 'Confirmer la finale', function () {
        var n = d.teams.filter(function (t) { return t.status === 'finale'; }).length;
        addOp({ k: 'finale-start' }, false);
        addOp(news('alerte', 'La finale commence : ' + n + ' équipe' + (n > 1 ? 's' : '') + ' assemble' + (n > 1 ? 'nt' : '') + ' le puzzle, chrono en direct.'));
      }); break;
      case 'team-add-toggle': ui.addOpen = !ui.addOpen; renderStaff(); persistStaff(); if (ui.addOpen) { var nf = $('st-new-name'); if (nf) nf.focus(); } break;
      case 'team-add': addTeam(); break;
      case 'score': tm = teamOf(a); if (tm) addOp({ k: 'score', id: tm.id, d: int(a.getAttribute('data-d'), 0) }); break;
      case 'status': tm = teamOf(a); if (tm) addOp({ k: 'status', id: tm.id, v: a.getAttribute('data-v') }); break;
      case 'adj': tm = teamOf(a); if (tm) { var sec = int(a.getAttribute('data-sec'), 0); addOp({ k: 'adj', id: tm.id, sec: sec, why: sec >= 0 ? 'Bonus' : 'Malus' }); } break;
      case 'finish': tm = teamOf(a); if (tm) {
        var pt = fmtDur(nowMs() - (parseT(d.hunt.finaleStart) || nowMs())), place = nextPlace(d, tm);
        addOp({ k: 'finish', id: tm.id }, false);
        addOp(news('resultat', 'L’équipe ' + tm.name + ' termine le puzzle en ' + pt + ' : ' + ordinal(place) + ' place !'));
      } break;
      case 'team-start': tm = teamOf(a); if (tm) addOp({ k: 'team-start', id: tm.id, when: isoWAT(nowMs()) }); break;
      case 'team-start-reset': tm = teamOf(a); if (tm) addOp({ k: 'team-start', id: tm.id, when: '' }); break;
      case 'team-edit': tm = teamOf(a); if (tm) { ui.editTeam = ui.editTeam === tm.id ? null : tm.id; renderStaff(); persistStaff(); } break;
      case 'team-del': tm = teamOf(a); if (tm) arm(a, 'Confirmer la suppression', function () { addOp({ k: 'team-del', id: tm.id }); }); break;
      case 'kind': ui.forms.news.kind = a.getAttribute('data-v'); all('[data-act="kind"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === a)); }); persistStaff(); break;
      case 'news-add':
        var text = str(ui.forms.news.text, 600);
        if (!text) { var nt = $('st-news-text'); if (nt) nt.focus(); toast('Écris le texte de l’annonce.'); break; }
        ui.forms.news.text = '';
        addOp(news(ui.forms.news.kind, text));
        break;
      case 'news-del': row = a.closest('[data-news]'); if (row) arm(a, 'Confirmer la suppression', function () { addOp({ k: 'news-del', id: row.getAttribute('data-news') }); }); break;
      case 'duel-start': startDuel(); break;
      case 'duel-win': row = a.closest('[data-duel]'); if (row) duelWin(row.getAttribute('data-duel'), a.getAttribute('data-w')); break;
      case 'duel-cancel': row = a.closest('[data-duel]'); if (row) arm(a, 'Confirmer', function () { addOp({ k: 'duel-cancel', id: row.getAttribute('data-duel') }); }); break;
      case 'duel-env': row = a.closest('[data-duel]'); if (row) duelEnv(row.getAttribute('data-duel'), a.getAttribute('data-env')); break;
      case 'riddle-save': saveRiddle(); break;
      case 'riddle-cancel': ui.forms.riddle = defaultForms().riddle; renderStaff(); persistStaff(); break;
      case 'riddle-test': row = a.closest('[data-riddle]'); if (row && SECRETS[row.getAttribute('data-riddle')]) openRiddle(row.getAttribute('data-riddle'), SECRETS[row.getAttribute('data-riddle')].key); break;
      case 'riddle-edit': row = a.closest('[data-riddle]'); if (row) {
        var rid8 = row.getAttribute('data-riddle'), sec2 = SECRETS[rid8];
        if (sec2) { ui.forms.riddle = { edit: rid8, title: sec2.title || '', q: sec2.q || '', h: sec2.h || '', answers: sec2.answers || '', ok: sec2.ok || '' }; renderStaff(true); persistStaff(); }
      } break;
      case 'riddle-del': row = a.closest('[data-riddle]'); if (row) arm(a, 'Confirmer la suppression', function () { var id8 = row.getAttribute('data-riddle'); dropSecret(id8); addOp({ k: 'riddle-del', id: id8 }); }); break;
      case 'sheet-dl': openSheet(); break;
    }
  }

  function bindEvents() {
    var app = $('app');
    app.addEventListener('click', onClick);
    app.addEventListener('submit', function (e) {
      if (e.target.id === 'riddle-form') { e.preventDefault(); submitAnswer(); return; }
      if (e.target.id === 'login-form') { e.preventDefault(); submitLogin(); return; }
      if (e.target.id !== 'reg') return;
      e.preventDefault();
      var o = readForm(), errs = validate(o, S().settings);
      showErrors(errs);
      if (errs.length) { var first = $(errs[0][0]); if (first && first.focus) { try { first.focus({ preventScroll: true }); } catch (x) { first.focus(); } } return; }
      ui.regDone = true; ui.lastReg = o;
      saveLS(LS.form, o);
      showRegOut(o, true);
    });
    app.addEventListener('input', function (e) {
      var t = e.target;
      if (t.closest('#reg')) {
        var grp = t.closest('[aria-invalid]');
        if (t.getAttribute('aria-invalid')) t.removeAttribute('aria-invalid');
        if (grp) grp.removeAttribute('aria-invalid');
        updateFormMeta();
        later('form', function () { var o = readForm(); if (o) saveLS(LS.form, o); }, 400);
        return;
      }
      if (t.closest('#staff')) { if (t.hasAttribute('data-form')) { if (t.tagName !== 'SELECT' && t.type !== 'checkbox') onForm(t); } else onBind(t, false); }
    });
    app.addEventListener('change', function (e) {
      var t = e.target;
      if (t.closest('#reg')) {
        var grp = t.closest('[aria-invalid]');
        if (grp) grp.removeAttribute('aria-invalid');
        updateFormMeta();
        var o = readForm(); if (o) saveLS(LS.form, o);
        return;
      }
      if (t.closest('#staff')) { if (t.hasAttribute('data-form')) { if (t.tagName === 'SELECT' || t.type === 'checkbox') onForm(t); } else if (!t.hasAttribute('data-act')) onBind(t, true); }
    });
    $('staff').addEventListener('scroll', function () { later('scroll', persistStaff, 400); }, true);
    /* Views that changed while someone was typing are redrawn once they leave the field, but never in the middle of a
       tap: redrawing between press and release would swallow the tap on the button they were reaching for. */
    var flushStale = function () {
      if (ui.ptr) return;
      if (ui.stale.reg && !focusIn('reg')) { ui.stale.reg = false; renderInscription(); }
      if (ui.stale.staff && !focusIn('staff')) { ui.stale.staff = false; renderStaff(); }
    };
    document.addEventListener('pointerdown', function () { ui.ptr = true; }, true);
    var release = function () { setTimeout(function () { ui.ptr = false; flushStale(); }, 0); };
    document.addEventListener('pointerup', release, true);
    document.addEventListener('pointercancel', release, true);
    app.addEventListener('focusout', function () { setTimeout(flushStale, 0); });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (ui.login) closeLogin(); else if (ui.riddle) closeRiddle(); else if (ui.staff) closeStaff(); else if (ui.screen) { try { location.hash = 'direct'; } catch (x) { setScreen(false); } }
    });
    window.addEventListener('hashchange', route);
  }

  function route() {
    var h = fromHash(), rd = riddleFromHash(h);
    if (rd) { openRiddle(rd.id, rd.key); return; }
    if (h === 'ecran') { setScreen(true); return; }
    if (ui.screen) setScreen(false);
    if (VIEW_OK[h]) { if (h !== ui.tab) showTab(h, true); return; }
    if (h === 'staff') { if (ui.canEdit) openStaff(); else if (!ui.auth) openLogin(); }
  }

  /* ---------- Boot ---------- */
  $('app').innerHTML = shellHTML();
  var startHash = fromHash();
  ui.tab = VIEW_OK[startHash] ? startHash : defaultTab();
  renderPublic();
  bindEvents();
  route();
  setInterval(function () { tick(); tickScreenCountdown(); }, 1000);
  syncClock(true);
  pull(true).then(function () {
    if (!ui.tabTouched && !VIEW_OK[startHash] && !riddleFromHash(startHash) && startHash !== 'ecran') showTab(defaultTab());
    if (ui.auth) enableStaff();
    startPolling();
  });
  /* A copy of the page stays on the phone, so it still opens without network at the venue. */
  if ('serviceWorker' in navigator && window.isSecureContext) { try { navigator.serviceWorker.register('sw.js').catch(noop); } catch (e) { /* pas de copie hors ligne */ } }
})();
</script>
